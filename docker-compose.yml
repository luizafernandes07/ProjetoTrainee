services:
  db:
    image: postgres:15-alpine
    container_name: agnus_postgres_db_v2
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-agnus_gestao}
    ports:
      - "5433:5432"
    volumes:
      - agnus_postgres_data_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-agnus_gestao}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: agnus_backend_app_v2
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3002
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-agnus_gestao}
      FRONTEND_URL: http://localhost:5180
      FRONTEND_ORIGIN: http://localhost:5180
    depends_on:
      db:
        condition: service_healthy

volumes:
  agnus_postgres_data_v2:

