$kind: http-request
url: http://localhost:3010/auth/login
method: POST
body:
  type: json
  content: "{\r

    \  \"email\": \"admin@agnus.com\",\r

    \  \"senha\": \"123456\"\r

    }"
scripts:
  - type: afterResponse
    code: "if (pm.response.code === 200) {\r

      \    var jsonData = pm.response.json();\r

      \    // Salva o token JWT na variável 'token' da Collection\r

      \    pm.collectionVariables.set(\"token\", jsonData.token);\r

      \    console.log(\"Token JWT salvo com sucesso na variável da Collection!\");\r

      }"
    language: text/javascript
order: 1000
